name: USA Military & Army Video Pipeline

on:
  schedule:
    # Run every 2 hours automatically
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      x_profiles:
        description: 'Comma-separated Twitter/X profiles to download from (e.g. USArmy,USNavy). Leave empty to use default military list.'
        required: false
        type: string
      twitter_profiles:
        description: 'Alias for x_profiles. Comma-separated Twitter profiles.'
        required: false
        type: string
      force_video_url:
        description: 'Force download & edit this exact X video URL (bypasses history and 24h window). Leave empty to auto-pick.'
        required: false
        type: string

jobs:
  run-pipeline:
    name: End-to-End USA Military Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: military-pipeline
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: 🚀 Step 1 - Run Pipeline Orchestrator (main_agent.py)
        id: main_agent
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_MILITARY }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          TIKTOK_AUTH_STATE: ${{ secrets.TIKTOK_AUTH_STATE }}
          TIKTOK_AUTH_STATE_B64: ${{ secrets.TIKTOK_AUTH_STATE_B64 }}
          X_PROFILES: ${{ github.event.inputs.x_profiles || secrets.X_PROFILES }}
          TWITTER_PROFILES: ${{ github.event.inputs.twitter_profiles || secrets.X_PROFILES }}
          X_FORCE_VIDEO_URL: ${{ github.event.inputs.force_video_url }}
          X_BACKUP_PROFILES: ${{ secrets.X_BACKUP_PROFILES }}
        run: |
          echo "Starting Main Agent..."
          python main_agent.py

      - name: 📢 Step 2 - Run Unified Reporter (agent_4_reporter.py)
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_MILITARY }}
          SKIP_WORKSPACE_CLEANUP: "1"
        run: |
          python src/agent_4_reporter.py

      - name: 💾 Commit edited video + history (permanent on GitHub)
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          mkdir -p output
          cp workspace/edited_*.mp4 output/ 2>/dev/null || true
          git add output/ 2>/dev/null || true
          git add downloaded_history.txt || true
          git add daily_limits.json || true
          git add -f tiktok_error.png || true
          git commit -m "Update download history + edited video [skip ci]" || true
          git pull origin master --rebase --strategy-option=ours || true
          git push origin HEAD:master || true

      - name: ☁️ Upload edited videos to Google Drive
        if: always()
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          DRIVE_UPLOAD_PATTERN: output/edited_*.mp4
        run: |
          echo "Uploading edited videos to Google Drive..."
          python src/drive_uploader.py

      - name: 📦 Upload edited video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edited-video
          path: |
            workspace/edited_*.mp4
            workspace/report.json
          if-no-files-found: ignore
